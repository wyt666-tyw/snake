<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇 Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background-color: #1e1e2e;
      color: #e4e4ef;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }

    .score-bar {
      display: flex;
      gap: 24px;
      font-size: 16px;
    }

    .game-area {
      padding: 8px;
      background-color: #2a2a3c;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    #game-canvas {
      display: block;
      background-color: #11111b;
      border: 2px solid #45475a;
      border-radius: 4px;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .controls button {
      padding: 8px 20px;
      font-size: 14px;
      color: #e4e4ef;
      background-color: #45475a;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .controls button:hover:not(:disabled) {
      background-color: #585b70;
    }

    .controls button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #mode-btn.ai-on {
      background-color: #89b4fa;
      color: #11111b;
      font-weight: 600;
    }

    #mode-btn.ai-on:hover:not(:disabled) {
      background-color: #a6c8fb;
    }

    footer {
      font-size: 12px;
      color: #8888a0;
    }
  </style>
</head>
<body>
  <header>
    <h1>贪吃蛇</h1>
  </header>

  <div class="score-bar">
    <span>得分：<b id="score">0</b></span>
    <span>最高分：<b id="high-score">0</b></span>
  </div>

  <main class="game-area">
    <canvas id="game-canvas" width="400" height="400"></canvas>
  </main>

  <div class="controls">
    <button type="button" id="start-btn">开始游戏</button>
    <button type="button" id="pause-btn">暂停</button>
    <button type="button" id="mode-btn">AI 自动模式：关</button>
  </div>

  <footer>手动模式：方向键 / WASD 移动，空格暂停；也可切换 AI 自动模式</footer>

  <script>
    // ==================== 常量配置 ====================
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const modeBtn = document.getElementById('mode-btn');

    const GRID_SIZE = 20;            // 每个格子的像素大小
    const GRID_COUNT = 20;           // 每条边的格数（400 / 20 = 20）
    const TICK_MS = 150;             // 蛇每移动一格的时间间隔（毫秒）
    const SCORE_PER_FOOD = 10;       // 吃到一个食物的得分
    const STORAGE_KEY = 'snake-high-score';

    // 四个移动方向（格子坐标增量）
    const DIRECTIONS = {
      up:    { x: 0,  y: -1 },
      down:  { x: 0,  y: 1  },
      left:  { x: -1, y: 0  },
      right: { x: 1,  y: 0  }
    };

    // 键盘按键 -> 方向 的映射（方向键 + WASD）
    const KEY_MAP = {
      arrowup: 'up',    w: 'up',
      arrowdown: 'down', s: 'down',
      arrowleft: 'left', a: 'left',
      arrowright: 'right', d: 'right'
    };

    // ==================== 游戏状态 ====================
    let snake = [];                       // 蛇身格子坐标数组，snake[0] 是蛇头
    let food = null;                      // 食物格子坐标 { x, y }
    let direction = DIRECTIONS.right;     // 当前实际移动方向
    let directionQueue = [];              // 待生效的方向输入队列，防止单步内 180° 掉头
    let score = 0;
    let highScore = Number(localStorage.getItem(STORAGE_KEY)) || 0;
    let state = 'idle';                   // idle | running | paused | over
    let mode = 'manual';                  // manual | ai
    let timer = null;

    highScoreEl.textContent = highScore;
    pauseBtn.disabled = true;

    // ==================== 初始化与流程控制 ====================

    // 重置为一局新游戏的初始数据
    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 }
      ];
      direction = DIRECTIONS.right;
      directionQueue = [];
      score = 0;
      scoreEl.textContent = '0';
      food = generateFood();
      draw();
    }

    // 开始 / 重新开始
    function startGame() {
      clearInterval(timer);
      state = 'running';
      resetGame();
      startBtn.textContent = '重新开始';
      pauseBtn.textContent = '暂停';
      pauseBtn.disabled = false;
      timer = setInterval(tick, TICK_MS);
    }

    // 暂停 / 继续
    function togglePause() {
      if (state === 'running') {
        state = 'paused';
        clearInterval(timer);
        pauseBtn.textContent = '继续';
        draw();
      } else if (state === 'paused') {
        state = 'running';
        pauseBtn.textContent = '暂停';
        timer = setInterval(tick, TICK_MS);
      }
    }

    // 游戏结束（撞墙 / 撞自己 / 棋盘被填满）
    function gameOver(win) {
      state = 'over';
      clearInterval(timer);
      pauseBtn.disabled = true;
      draw();
      drawOverlay(
        win ? '你赢了！' : '游戏结束',
        '本局得分 ' + score + '，按回车或点击「重新开始」'
      );
    }

    // ==================== 核心逻辑：每一步移动 ====================
    function tick() {
      // 决定本步方向：AI 模式由决策算法给出，手动模式取排队输入
      if (mode === 'ai') {
        const aiDir = decideAiDirection();
        if (aiDir) direction = aiDir;
      } else if (directionQueue.length > 0) {
        direction = directionQueue.shift();
      }

      const head = snake[0];
      const newHead = { x: head.x + direction.x, y: head.y + direction.y };
      const willEat = food !== null && newHead.x === food.x && newHead.y === food.y;

      // 1) 撞墙检测
      if (newHead.x < 0 || newHead.x >= GRID_COUNT ||
          newHead.y < 0 || newHead.y >= GRID_COUNT) {
        gameOver(false);
        return;
      }

      // 2) 撞到自己检测：不吃食物时蛇尾会移走，因此蛇尾格不参与碰撞
      const bodyToCheck = willEat ? snake : snake.slice(0, -1);
      if (bodyToCheck.some(function (seg) {
        return seg.x === newHead.x && seg.y === newHead.y;
      })) {
        gameOver(false);
        return;
      }

      // 新蛇头入列
      snake.unshift(newHead);

      if (willEat) {
        // 吃到食物：加分、不移除蛇尾（身体变长）、生成新食物
        score += SCORE_PER_FOOD;
        scoreEl.textContent = String(score);
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = String(highScore);
          localStorage.setItem(STORAGE_KEY, String(highScore));
        }
        food = generateFood();
        if (food === null) {
          gameOver(true);   // 棋盘已被蛇填满，通关
          return;
        }
      } else {
        // 没吃到：移除蛇尾，长度不变
        snake.pop();
      }

      draw();
    }

    // 在所有空闲格子中随机生成一个食物（避开蛇身）
    function generateFood() {
      const occupied = new Set(snake.map(function (seg) {
        return seg.x + ',' + seg.y;
      }));
      const freeCells = [];
      for (let y = 0; y < GRID_COUNT; y++) {
        for (let x = 0; x < GRID_COUNT; x++) {
          if (!occupied.has(x + ',' + y)) {
            freeCells.push({ x: x, y: y });
          }
        }
      }
      if (freeCells.length === 0) return null;
      return freeCells[Math.floor(Math.random() * freeCells.length)];
    }

    // ==================== AI 自动决策（仅自动模式使用） ====================
    // 两段式保命策略：
    //   ① BFS 找蛇头到食物的最短路径，逐步模拟验证路径合法，
    //      且"吃完后"的剩余活动空间（flood-fill）足够容纳蛇身才去吃；
    //   ② 追食物不安全时，沿最短路径跟随自己的蛇尾绕圈保命；
    //   ③ 再不行则走向当前可达空间最大的邻格；
    //   ④ 全部失败返回 null，保持原方向（会正常触发碰撞结束）。

    const FOUR_DIRS = [
      DIRECTIONS.up, DIRECTIONS.down, DIRECTIONS.left, DIRECTIONS.right
    ];

    function cellKey(c) {
      return c.x + ',' + c.y;
    }

    // 静态网格 BFS：返回 start 之后到 target 的每一步格子（含 target），不可达返回 null
    // blocked 中的格子视为障碍，但 target 本身始终允许进入
    function bfsPath(start, target, blocked) {
      const startKey = cellKey(start);
      const queue = [start];
      const visited = new Set([startKey]);
      const prev = new Map();

      while (queue.length > 0) {
        const cur = queue.shift();
        if (cur.x === target.x && cur.y === target.y) {
          const path = [];
          let nodeKey = cellKey(cur);
          while (nodeKey !== startKey) {
            const parts = nodeKey.split(',');
            path.push({ x: Number(parts[0]), y: Number(parts[1]) });
            nodeKey = prev.get(nodeKey);
          }
          path.reverse();
          return path;
        }
        for (let i = 0; i < FOUR_DIRS.length; i++) {
          const d = FOUR_DIRS[i];
          const next = { x: cur.x + d.x, y: cur.y + d.y };
          const k = cellKey(next);
          if (next.x < 0 || next.x >= GRID_COUNT ||
              next.y < 0 || next.y >= GRID_COUNT) continue;
          if (visited.has(k)) continue;
          const isTarget = next.x === target.x && next.y === target.y;
          if (blocked.has(k) && !isTarget) continue;
          visited.add(k);
          prev.set(k, cellKey(cur));
          queue.push(next);
        }
      }
      return null;
    }

    // flood-fill：从 start 出发避开 blocked 的可达格子数量
    function reachableCount(start, blocked) {
      const seen = new Set([cellKey(start)]);
      const stack = [start];
      let count = 0;
      while (stack.length > 0) {
        const cur = stack.pop();
        count++;
        for (let i = 0; i < FOUR_DIRS.length; i++) {
          const d = FOUR_DIRS[i];
          const next = { x: cur.x + d.x, y: cur.y + d.y };
          const k = cellKey(next);
          if (next.x < 0 || next.x >= GRID_COUNT ||
              next.y < 0 || next.y >= GRID_COUNT) continue;
          if (seen.has(k) || blocked.has(k)) continue;
          seen.add(k);
          stack.push(next);
        }
      }
      return count;
    }

    // 判断"下一步走到 step"在当前局面下是否合法
    // willEat=false 时蛇尾本步会移走，蛇尾格允许进入
    function isStepLegalNow(step, willEat) {
      if (step.x < 0 || step.x >= GRID_COUNT ||
          step.y < 0 || step.y >= GRID_COUNT) return false;
      const limit = willEat ? snake.length : snake.length - 1;
      for (let i = 0; i < limit; i++) {
        if (snake[i].x === step.x && snake[i].y === step.y) return false;
      }
      return true;
    }

    // 沿给定路径逐步模拟蛇的移动，返回走完后的蛇身副本；任一步非法返回 null
    function simulatePath(body, path) {
      const sim = body.map(function (s) { return { x: s.x, y: s.y }; });
      for (let p = 0; p < path.length; p++) {
        const step = path[p];
        if (step.x < 0 || step.x >= GRID_COUNT ||
            step.y < 0 || step.y >= GRID_COUNT) return null;
        const willEat = food !== null && step.x === food.x && step.y === food.y;
        // 不吃食物时蛇尾本步会移走，蛇尾格允许进入
        const limit = willEat ? sim.length : sim.length - 1;
        let hit = false;
        for (let i = 0; i < limit; i++) {
          if (sim[i].x === step.x && sim[i].y === step.y) { hit = true; break; }
        }
        if (hit) return null;
        sim.unshift({ x: step.x, y: step.y });
        if (!willEat) sim.pop();
      }
      return sim;
    }

    // 评估"下一步走到 step（不吃食物）"之后，蛇头的可达格子数量
    function spaceAfterStep(step) {
      const sim = snake.map(function (s) { return { x: s.x, y: s.y }; });
      sim.unshift({ x: step.x, y: step.y });
      sim.pop();
      return reachableCount(sim[0], new Set(sim.map(cellKey)));
    }

    // 由"蛇头 -> 下一步格子"的位移反查方向对象
    function dirBetween(from, to) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      for (let i = 0; i < FOUR_DIRS.length; i++) {
        if (FOUR_DIRS[i].x === dx && FOUR_DIRS[i].y === dy) return FOUR_DIRS[i];
      }
      return null;
    }

    // AI 每一步的决策入口，返回一个方向对象（或 null）
    function decideAiDirection() {
      if (!food) return null;
      const head = snake[0];

      // 静态障碍：当前蛇身（蛇尾下一步会离开，不视为障碍）
      const blockedStatic = new Set();
      for (let i = 0; i < snake.length - 1; i++) {
        blockedStatic.add(cellKey(snake[i]));
      }

      // ① 尝试沿最短路径去吃食物
      const foodPath = bfsPath(head, food, blockedStatic);
      if (foodPath && foodPath.length > 0) {
        const sim = simulatePath(snake, foodPath);
        if (sim) {
          // 吃完食物后蛇已变长，整副身体都占着格子；评估蛇头剩余活动空间
          const blockedAfter = new Set(sim.map(cellKey));
          const space = reachableCount(sim[0], blockedAfter);
          if (space >= sim.length) {
            return dirBetween(head, foodPath[0]);
          }
        }
      }

      // ② 不安全就追尾：贴着自己的蛇尾走，但要求走完后仍有容纳整条蛇的空间
      const tail = snake[snake.length - 1];
      const tailPath = bfsPath(head, tail, blockedStatic);
      if (tailPath && tailPath.length > 0 && isStepLegalNow(tailPath[0], false) &&
          spaceAfterStep(tailPath[0]) >= snake.length) {
        return dirBetween(head, tailPath[0]);
      }

      // ③ 漫游兜底：选择走完后可达空间最大的合法邻格
      let bestDir = null;
      let bestSpace = -1;
      for (let i = 0; i < FOUR_DIRS.length; i++) {
        const d = FOUR_DIRS[i];
        const next = { x: head.x + d.x, y: head.y + d.y };
        if (!isStepLegalNow(next, false)) continue;
        const space = spaceAfterStep(next);
        if (space > bestSpace) {
          bestSpace = space;
          bestDir = d;
        }
      }
      if (bestDir) return bestDir;

      // ④ 彻底无路可走，交由主循环按原方向移动并正常判定游戏结束
      return null;
    }

    // ==================== 键盘输入 ====================
    document.addEventListener('keydown', function (e) {
      const key = e.key.toLowerCase();

      if (KEY_MAP[key]) {
        e.preventDefault();   // 阻止方向键滚动页面
        if (state !== 'running' || mode !== 'manual') return;

        const next = DIRECTIONS[KEY_MAP[key]];
        // 与队列中最新方向比较；队列最多缓存 2 个输入
        const last = directionQueue.length > 0
          ? directionQueue[directionQueue.length - 1]
          : direction;
        const isOpposite = next.x + last.x === 0 && next.y + last.y === 0;
        if (next !== last && !isOpposite && directionQueue.length < 2) {
          directionQueue.push(next);
        }
      } else if (key === ' ') {
        e.preventDefault();
        togglePause();
      } else if (key === 'enter') {
        if (state === 'idle' || state === 'over') startGame();
      }
    });

    // 按钮控制
    startBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', togglePause);
    modeBtn.addEventListener('click', toggleMode);

    // 切换 手动 / AI 自动 模式（任何状态下都可切换，模式跨局保留）
    function toggleMode() {
      mode = mode === 'manual' ? 'ai' : 'manual';
      directionQueue = [];
      modeBtn.textContent = mode === 'ai' ? 'AI 自动模式：开' : 'AI 自动模式：关';
      modeBtn.classList.toggle('ai-on', mode === 'ai');
      if (state === 'idle' || state === 'paused' || state === 'over') draw();
    }

    // ==================== 画面渲染 ====================

    // 手绘圆角矩形路径（避免依赖部分浏览器不支持的 ctx.roundRect）
    function traceRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID_COUNT; i++) {
        const p = i * GRID_SIZE + 0.5;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
      }
    }

    function drawFood() {
      if (!food) return;
      const cx = food.x * GRID_SIZE + GRID_SIZE / 2;
      const cy = food.y * GRID_SIZE + GRID_SIZE / 2;
      ctx.fillStyle = '#f38ba8';
      ctx.beginPath();
      ctx.arc(cx, cy, GRID_SIZE / 2 - 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSnake() {
      snake.forEach(function (seg, i) {
        const pad = 1;
        ctx.fillStyle = i === 0 ? '#a6e3a1' : '#4caf6d';   // 蛇头浅绿，蛇身深绿
        traceRoundedRect(
          seg.x * GRID_SIZE + pad,
          seg.y * GRID_SIZE + pad,
          GRID_SIZE - pad * 2,
          GRID_SIZE - pad * 2,
          5
        );
        ctx.fill();
      });
      drawSnakeEyes();
    }

    // 在蛇头上画两只眼睛，朝向当前移动方向
    function drawSnakeEyes() {
      const head = snake[0];
      const cx = head.x * GRID_SIZE + GRID_SIZE / 2;
      const cy = head.y * GRID_SIZE + GRID_SIZE / 2;
      const forward = 4;
      const side = 4;
      const perpX = -direction.y;   // 方向的垂直向量
      const perpY = direction.x;
      ctx.fillStyle = '#11111b';
      [-1, 1].forEach(function (s) {
        ctx.beginPath();
        ctx.arc(
          cx + direction.x * forward + perpX * side * s,
          cy + direction.y * forward + perpY * side * s,
          1.8, 0, Math.PI * 2
        );
        ctx.fill();
      });
    }

    // 画布中央的提示遮罩（待开始 / 暂停 / 结束）
    function drawOverlay(title, subtitle) {
      ctx.fillStyle = 'rgba(17, 17, 27, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#e4e4ef';
      ctx.font = 'bold 32px "Microsoft YaHei", sans-serif';
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = '14px "Microsoft YaHei", sans-serif';
      ctx.fillStyle = '#a6a6c0';
      ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 20);
    }

    function draw() {
      ctx.fillStyle = '#11111b';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawFood();
      drawSnake();

      if (state === 'idle') {
        drawOverlay(
          '贪吃蛇',
          (mode === 'ai' ? '当前【AI 自动模式】，' : '') + '按回车或点击「开始游戏」'
        );
      } else if (state === 'paused') {
        drawOverlay('已暂停', '按空格或点击「继续」');
      }
    }

    // 首次加载：绘制初始画面与待开始提示
    resetGame();
  </script>
</body>
</html>
