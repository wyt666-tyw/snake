<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇 Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background-color: #1e1e2e;
      color: #e4e4ef;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 2px;
    }

    .score-bar {
      display: flex;
      gap: 24px;
      font-size: 16px;
    }

    .game-area {
      padding: 8px;
      background-color: #2a2a3c;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    #game-canvas {
      display: block;
      background-color: #11111b;
      border: 2px solid #45475a;
      border-radius: 4px;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .controls button {
      padding: 8px 20px;
      font-size: 14px;
      color: #e4e4ef;
      background-color: #45475a;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .controls button:hover {
      background-color: #585b70;
    }

    footer {
      font-size: 12px;
      color: #8888a0;
    }
  </style>
</head>
<body>
  <header>
    <h1>贪吃蛇</h1>
  </header>

  <div class="score-bar">
    <span>得分：<b id="score">0</b></span>
    <span>最高分：<b id="high-score">0</b></span>
  </div>

  <main class="game-area">
    <canvas id="game-canvas" width="400" height="400"></canvas>
  </main>

  <div class="controls">
    <button type="button" id="start-btn">开始游戏</button>
    <button type="button" id="pause-btn">暂停</button>
  </div>

  <footer>使用方向键或 WASD 控制移动</footer>

  <script>
    // 游戏逻辑待实现：蛇的移动、食物生成、碰撞检测、计分等
  </script>
</body>
</html>
